<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCMVR — Portail des Conventions & Subventions Associatives</title>
    <link rel="icon" type="image/png" href="logo-collectivite.png" />

    <!-- Tailwind CSS (CDN Play) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        };
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase Client JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Feuille de style métier CCMVR -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen flex flex-col lg:flex-row text-slate-900 selection:bg-blue-600 selection:text-white">

    <!-- ================================================================== -->
    <!-- LOADER INITIALISATION                                              -->
    <!-- ================================================================== -->
    <div id="global-loader" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center no-print" style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 px-6 py-5 flex items-center gap-4">
            <div class="w-7 h-7 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <div>
                <div class="text-xs font-extrabold uppercase tracking-wider text-slate-900">Portail CCMVR</div>
                <div class="text-[11px] text-slate-500">Synchronisation sécurisée en cours...</div>
            </div>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- PORTAIL D'AUTHENTIFICATION SUPABASE (CONNEXION OBLIGATOIRE)        -->
    <!-- ================================================================== -->
    <div id="auth-screen" class="fixed inset-0 z-40 bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 flex items-center justify-center p-4 overflow-y-auto no-print" style="display: none;"></div>

    <!-- ================================================================== -->
    <!-- VOLET LATÉRAL GAUCHE REDIMENSIONNABLE & REPLIABLE                  -->
    <!-- ================================================================== -->
    <aside id="app-sidebar" style="width: 310px;" class="w-full lg:shrink-0 bg-gradient-to-b from-slate-900 via-slate-900 to-indigo-950 text-white lg:min-h-screen lg:sticky lg:top-0 lg:h-screen flex flex-col justify-between border-r border-slate-800 shadow-2xl z-30 no-print overflow-y-auto relative transition-[width] duration-150">
    </aside>

    <!-- Poignée de redimensionnement à la souris du volet gauche (Desktop) -->
    <div id="sidebar-resizer" title="Glisser pour agrandir ou réduire la largeur du volet" class="hidden lg:block w-1.5 hover:w-2 bg-transparent hover:bg-blue-500/60 cursor-col-resize z-30 shrink-0 transition-all no-print"></div>

    <!-- Petit bouton discret sur le bord gauche pour réouvrir le volet quand il est masqué -->
    <button id="sidebar-reopen-edge-btn" onclick="CCMVR.App.toggleSidebarHide()" title="Réouvrir le volet latéral" style="display: none;" class="fixed left-0 top-1/2 -translate-y-1/2 z-40 bg-slate-900/90 hover:bg-blue-600 text-white py-4 px-1.5 rounded-r-xl shadow-lg border border-l-0 border-slate-700 transition-all flex items-center justify-center group no-print">
        <span class="text-xs font-extrabold group-hover:translate-x-0.5 transition-transform">❯</span>
    </button>

    <!-- ================================================================== -->
    <!-- ZONE CENTRALE & DROITE (BARRE SUPÉRIEURE + CONTENU PRINCIPAL)      -->
    <!-- ================================================================== -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">
        <!-- Barre supérieure épurée -->
        <header id="app-header" class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs no-print"></header>

        <!-- Conteneur masqué pour compatibilité -->
        <div id="app-subnav" class="hidden no-print"></div>

        <!-- Espace de travail principal animé -->
        <main id="app-main" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 view-animate"></main>

        <!-- Pied de page institutionnel sobre -->
        <footer class="bg-white/80 backdrop-blur-xs border-t border-slate-200/80 mt-12 py-4 no-print">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-[11px] text-slate-500">
                <div class="flex items-center gap-3">
                    <img src="logo-collectivite.png" alt="CCMVR" class="h-7 w-auto object-contain" onerror="this.style.display='none'" />
                    <span class="font-bold text-slate-700">Communauté de Communes Marches du Velay Rochebaron</span>
                </div>
                <div class="text-slate-400">
                    Portail de Gestion des Subventions et Conventions Associatives
                </div>
            </div>
        </footer>
    </div>

    <!-- ================================================================== -->
    <!-- MODALE UNIVERSELLE (INSTRUCTION, CONVENTION, ATTESTATION)          -->
    <!-- ================================================================== -->
    <div id="universal-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="universal-modal-title" class="hidden fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto no-print" onclick="if(event.target === this) CCMVR.App.closeModal()">
        <div id="universal-modal-content" class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-5xl w-full overflow-hidden my-8"></div>
    </div>

    <!-- ================================================================== -->
    <!-- CONTENEUR DE NOTIFICATIONS TOAST                                   -->
    <!-- ================================================================== -->
    <div id="toast-container" role="status" aria-live="polite" aria-atomic="true" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md no-print"></div>

    <!-- ================================================================== -->
    <!-- ARCHITECTURE MODULAIRE JAVASCRIPT CCMVR                            -->
    <!-- ================================================================== -->
    <!-- Moteur PDF-Lib pour manipulation et extraction chirurgicale de pages PDF -->
    <script src="js/pdf-lib.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/api-entreprise-cache.js"></script>
    <script src="js/official-sample-pdf.js"></script>
    <script src="js/finance-engine.js"></script>
    <script src="js/doc-generator.js"></script>
    <script src="js/store.js"></script>
    <script src="js/notification-service.js"></script>
    <script src="js/app-core.js"></script>
    <script src="js/app-cdg.js"></script>
    <script src="js/app-pole.js"></script>
    <script src="js/app-regie.js"></script>
    <script src="js/app-asso.js"></script>
    <script src="js/modals-dossier.js"></script>
    <script src="js/modals-convention.js"></script>
    <script src="js/modals-annuaire.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Fermeture rapide de la modale avec la touche Échap
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && window.CCMVR && window.CCMVR.App) {
                window.CCMVR.App.closeModal();
            }
        });

        // Redimensionnement libre du volet latéral gauche à la souris
        (function initSidebarResizer() {
            const resizer = document.getElementById('sidebar-resizer');
            const sidebar = document.getElementById('app-sidebar');
            if (!resizer || !sidebar) return;
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                if (window.CCMVR?.App?.sidebarCollapsed) return;
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                sidebar.style.transition = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const newWidth = Math.max(220, Math.min(460, e.clientX));
                sidebar.style.width = newWidth + 'px';
                if (window.CCMVR?.App) window.CCMVR.App.sidebarWidth = newWidth;
            });

            window.addEventListener('mouseup', () => {
                if (!isResizing) return;
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                sidebar.style.transition = '';
            });
        })();
    </script>
</body>
</html>
